# ============================================================================
# Lawin — Nginx Reverse Proxy
# معماری پیشنهادی:  اینترنت → (Tunnel/TLS) → Nginx(127.0.0.1:8080) → Daphne(127.0.0.1:8000)
# Nginx روی 127.0.0.1 گوش می‌دهد تا مستقیماً از اینترنت در دسترس نباشد؛
# لایه‌ی TLS را تونل (Tailscale Funnel یا Cloudflare Tunnel) فراهم می‌کند.
#
# نصب:
#   sudo cp deploy/nginx/lawin.conf /etc/nginx/sites-available/lawin.conf
#   sudo ln -s /etc/nginx/sites-available/lawin.conf /etc/nginx/sites-enabled/lawin.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# اگر تونل هدر X-Forwarded-Proto می‌فرستد همان را حفظ کن، وگرنه از طرح داخلی استفاده کن
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream lawin_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 127.0.0.1:8080;
    server_name _;

    # حداکثر حجم آپلود تصویر محصول/لوگو
    client_max_body_size 20m;

    # --- فایل‌های استاتیک (collectstatic) ---
    location /static/ {
        alias /opt/lawin/app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- فایل‌های رسانه‌ای (آپلودها، تصاویر محصول، QRها) ---
    location /media/ {
        alias /opt/lawin/app/media/;
        access_log off;
        expires 7d;
    }

    # --- Django (REST + صفحات مشتری) ---
    location / {
        proxy_pass http://lawin_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # --- WebSocket ادمین/مشتری ---
    location /ws/ {
        proxy_pass http://lawin_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
    }

    # هدرهای امنیتی پایه (Django هم برخی را می‌فرستد)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
